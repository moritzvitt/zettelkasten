# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Moritz' Tea Garden
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: de-DE
  baseUrl: v5--moritz-zettelkasten.netlify.app
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Noto Serif
      body: Noto Serif
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#ffffff"
        lightgray: "#deded6"
        gray: "#a8aaa0"
        darkgray: "#243027"
        dark: "#1f1f1e"
        secondary: "#00a83b"
        tertiary: "#00b894"
        highlight: "rgba(57, 255, 20, 0.13)"
        textHighlight: "#eaffbf"
      darkMode:
        light: "#121412"
        lightgray: "#30362f"
        gray: "#777d72"
        darkgray: "#d9ded5"
        dark: "#f4f6ef"
        secondary: "#c8fff2"
        tertiary: "#d9ff66"
        highlight: "rgba(102, 255, 209, 0.13)"
        textHighlight: "rgba(217, 255, 102, 0.14)"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
      mermaid: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: ./plugins/discord-spoilers
    enabled: true
    order: 45
  - source: github:quartz-community/table-of-contents
    enabled: false
    order: 50
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: ./plugins/local-media-player
    enabled: true
    options:
      mediaRoot: /Users/moritzvitt/Notes/Obsidian Notes/Digital Garden/media-lib/Media
      route: /local-media
    order: 65
  - source: ./plugins/svg-viewer
    enabled: true
    order: 67
  - source: ./plugins/pdf-viewer
    enabled: true
    order: 68
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/unlisted-pages
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/alias-redirects
    enabled: false
  - source: github:quartz-community/favicon
    enabled: false
  - source: github:quartz-community/og-image
    enabled: false
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: ./plugins/explorer
    enabled: false
    options:
      title: Explorer
      folderClickBehavior: link
      folderDefaultState: collapsed
      useSavedState: true
      filterFn: |
        (node) => {
          if (node.slugSegment === "tags") return false

          const currentSlug = document.body?.dataset?.slug ?? ""
          const focusedFolder = ["japanese", "zettelkasten"].find(
            (folder) => currentSlug === `${folder}/index` || currentSlug.startsWith(`${folder}/`),
          )

          if (!focusedFolder) return true

          return (
            node.slugSegment === focusedFolder ||
            node.slug === `${focusedFolder}/index` ||
            node.slugSegments?.[0] === focusedFolder
          )
        }
    layout:
      position: left
      priority: 50
  - source: ./plugins/graph
    enabled: true
    options:
      localGraph:
        depth: 1
        scale: 0.95
        repelForce: 0.75
        centerForce: 0.22
        linkDistance: 42
        fontSize: 0.55
        opacityScale: 0.85
        showTags: true
      globalGraph:
        enabled: false
        depth: -1
        scale: 0.85
        repelForce: 0.65
        centerForce: 0.18
        linkDistance: 36
        fontSize: 0.55
        opacityScale: 0.8
        showTags: true
    layout:
      position: right
      priority: 10
      condition: not-japanese
  - source: ./plugins/structured-brain
    enabled: false
    options:
      height: 620
    layout:
      position: afterBody
      priority: 20
  - source: ./plugins/vocap-trainer
    enabled: false
    layout:
      position: afterBody
      priority: 30
  - source: ./plugins/contribute
    enabled: false
    options:
      repositoryUrl: https://github.com/moritzvitt/zettelkasten
      zipUrl: https://github.com/moritzvitt/zettelkasten/archive/refs/heads/v5.zip
      markdownUrl: https://github.com/moritzvitt/zettelkasten/tree/v5/content
    layout:
      position: right
      priority: 45
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: false
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/article-title
    enabled: false
  - source: github:quartz-community/content-meta
    enabled: false
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: ./plugins/font-reset
    enabled: true
    layout:
      position: left
      priority: 36
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: false
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        Zettelkasten: /
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - next
        - previous
        - parents
        - children
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: afterBody
      priority: 15
      display: all
  - source: ./plugins/obsidian-plugin-excalidraw
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      positions:
        right: []
    tag:
      positions:
        right: []
    canvas: {}
    excalidraw: {}
