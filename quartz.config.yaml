# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Moritz Zettelkasten
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: de-DE
  baseUrl: v5--moritz-zettelkasten.netlify.app
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: local
    cdnCaching: false
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#f7f7f3"
        lightgray: "#deded6"
        gray: "#a8aaa0"
        darkgray: "#4a5048"
        dark: "#151a17"
        secondary: "#1f6f61"
        tertiary: "#8b5e34"
        highlight: rgba(31, 111, 97, 0.12)
        textHighlight: "#fff2a8"
      darkMode:
        light: "#121412"
        lightgray: "#30362f"
        gray: "#777d72"
        darkgray: "#d9ded5"
        dark: "#f4f6ef"
        secondary: "#91d6c9"
        tertiary: "#d8ad75"
        highlight: rgba(145, 214, 201, 0.12)
        textHighlight: "#6f5a0088"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
      mermaid: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: false
    order: 50
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/unlisted-pages
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: false
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    layout:
      position: left
      priority: 50
  - source: ./plugins/graph
    enabled: true
    options:
      localGraph:
        depth: 1
        scale: 0.95
        repelForce: 0.75
        centerForce: 0.22
        linkDistance: 42
        fontSize: 0.55
        opacityScale: 0.85
        showTags: false
      globalGraph:
        depth: -1
        scale: 0.85
        repelForce: 0.65
        centerForce: 0.18
        linkDistance: 36
        fontSize: 0.55
        opacityScale: 0.8
        showTags: false
    layout:
      position: right
      priority: 10
  - source: ./plugins/structured-brain
    enabled: true
    options:
      height: 620
    layout:
      position: beforeBody
      priority: 20
  - source: ./plugins/contribute
    enabled: true
    options:
      repositoryUrl: https://github.com/moritzvitt/zettelkasten
      zipUrl: https://github.com/moritzvitt/zettelkasten/archive/refs/heads/v5.zip
      markdownUrl: https://github.com/moritzvitt/zettelkasten/tree/v5/content
    layout:
      position: right
      priority: 45
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: false
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: false
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: false
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        Zettelkasten: /
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - source
        - tags
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
