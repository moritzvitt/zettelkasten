<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moritz' Garden</title>
    <style>
      :root {
        color-scheme: light;
        --page-background: #ffffff;
        --headline-color: #2f1b14;
        --focus-color: #7f3b18;
        --frame-color: #2f1b14;
        background: var(--page-background);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        overflow: auto;
        background: var(--page-background);
      }

      .scene {
        width: min(96vw, 1000px);
        margin: 0 auto;
        padding: clamp(18px, 4vmin, 40px) 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(18px, 5vmin, 40px);
      }

      .headline {
        margin: 0;
        color: var(--headline-color);
        font-family: "Courier New", Courier, monospace;
        font-size: clamp(1.5rem, 7vmin, 4rem);
        font-weight: 700;
        line-height: 1;
        text-align: center;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .object-button {
        place-items: center;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .teapot-card {
        position: relative;
        width: min(44vmin, 280px);
        aspect-ratio: 1;
      }

      .teapot-button {
        width: 100%;
        height: 100%;
        display: grid;
      }

      .teacup-button {
        position: absolute;
        inset: 0;
        z-index: 4;
        display: grid;
        width: 100%;
        height: 100%;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transition: opacity 160ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .teacup-button.is-visible {
        opacity: 1;
        pointer-events: auto;
      }

      .teacup-tooltip {
        position: absolute;
        left: 50%;
        bottom: calc(100% + 10px);
        z-index: 6;
        width: min(260px, 82vw);
        padding: 8px 10px;
        border: 2px solid #2f1f1a;
        background: #fff7da;
        color: #2f1f1a;
        font-size: clamp(0.72rem, 2.6vw, 0.92rem);
        line-height: 1.3;
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 4px);
        transition:
          opacity 120ms ease,
          transform 120ms ease;
        box-shadow: 4px 4px 0 rgba(47, 31, 26, 0.2);
      }

      .teacup-tooltip::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 100%;
        width: 10px;
        height: 10px;
        border-right: 2px solid #2f1f1a;
        border-bottom: 2px solid #2f1f1a;
        background: #fff7da;
        transform: translate(-50%, -5px) rotate(45deg);
      }

      .teacup-button.is-visible:hover .teacup-tooltip,
      .teacup-button.is-visible:focus-visible .teacup-tooltip {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .item-row {
        width: min(92vw, 768px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(14px, 4vw, 40px);
      }

      .item-button {
        width: min(24vmin, 150px);
        aspect-ratio: 1;
        display: grid;
      }

      .garden-button {
        width: min(44vmin, 280px);
        overflow: hidden;
      }

      .garden-stage {
        background: #071a25;
      }

      .garden-stage .item-art,
      .garden-water {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .garden-stage .item-art {
        z-index: 1;
        object-fit: cover;
        transition: opacity 180ms ease;
      }

      .garden-water {
        z-index: 2;
        background:
          radial-gradient(circle at 42% 46%, rgba(255, 255, 255, 0.22), transparent 5%),
          linear-gradient(125deg, rgba(255, 255, 255, 0.16), transparent 38%),
          url("/pixel/koi10.png") center / cover no-repeat;
        filter: url("#garden-water-filter");
        mix-blend-mode: screen;
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
      }

      .garden-button.is-water-active .garden-water,
      .garden-button:hover .garden-water,
      .garden-button:focus-visible .garden-water {
        opacity: 1;
      }

      .garden-button.is-water-active .item-art,
      .garden-button:hover .item-art,
      .garden-button:focus-visible .item-art {
        opacity: 0;
      }

      .zettel-button {
        width: 100%;
        height: 100%;
        aspect-ratio: 1;
      }

      .zettel-button .item-stage {
        aspect-ratio: 1;
      }

      .zettel-card {
        position: relative;
        width: min(44vmin, 280px);
        aspect-ratio: 1;
      }

      .object-button:focus-visible {
        outline: 3px solid var(--focus-color);
        outline-offset: 16px;
      }

      .teapot-stage,
      .item-stage {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        display: grid;
        place-items: center;
      }

      .teapot-stage::after,
      .item-stage::after {
        position: absolute;
        inset: 0;
        z-index: 3;
        border: 1px solid var(--frame-color);
        content: "";
        pointer-events: none;
      }

      .study-link {
        position: absolute;
        top: 0;
        right: 0;
        z-index: 5;
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        background: #fff8e6;
        color: var(--headline-color);
        font-family: "Courier New", Courier, monospace;
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0;
        text-decoration: none;
      }

      .study-link::after {
        position: absolute;
        inset: 0;
        border-top: 1px solid var(--frame-color);
        border-right: 1px solid var(--frame-color);
        border-left: 1px solid var(--frame-color);
        border-bottom: 1px solid var(--frame-color);
        content: "";
        pointer-events: none;
      }

      .study-link:hover,
      .study-link:focus-visible {
        background: #ffe6aa;
        outline: none;
      }

      .item-art {
        width: 100%;
        height: 100%;
        object-fit: contain;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        user-select: none;
        -webkit-user-drag: none;
      }

      .item-sprite {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      .zettel-sprite {
        width: 100%;
        height: auto;
        aspect-ratio: 84 / 81;
      }

      .teapot-sprite {
        display: block;
        width: auto;
        height: 100%;
        aspect-ratio: 44 / 45;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        position: relative;
        z-index: 1;
        transform-origin: center;
        will-change: transform;
        cursor: pointer;
      }

      .teacup-art {
        width: 62%;
        height: 62%;
        align-self: end;
        justify-self: center;
        margin-bottom: 12%;
        object-fit: contain;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        user-select: none;
        -webkit-user-drag: none;
      }

      .object-button.is-selected:not(.is-walking-away):not(.teapot-button) {
        transform: translateY(-4px);
      }

      @media (max-width: 640px) {
        .scene {
          width: 100%;
          margin-left: 0;
          padding: 0 18px;
        }

        .teapot-card,
        .garden-button,
        .zettel-card {
          width: min(62vmin, 250px);
        }

        .item-row {
          width: 100%;
          gap: 10px;
        }

        .item-button {
          width: min(28vmin, 110px);
        }

        .garden-button {
          width: min(62vmin, 250px);
        }

        .zettel-button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <svg class="water-filter-source" width="0" height="0" aria-hidden="true" focusable="false">
      <filter id="garden-water-filter" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence
          id="garden-water-turbulence"
          type="fractalNoise"
          numOctaves="3"
          seed="8"
          baseFrequency="0.018 0.045"
        ></feTurbulence>
        <feDisplacementMap
          id="garden-water-displacement"
          scale="0"
          in="SourceGraphic"
        ></feDisplacementMap>
      </filter>
    </svg>
    <main class="scene">
      <h1 class="headline">Moritz' Digital Tea Garden!</h1>

      <div class="teapot-card">
        <button class="teacup-button" type="button" aria-label="Teetasse" aria-describedby="teacup-tooltip">
          <span class="teacup-tooltip" id="teacup-tooltip" role="tooltip">
            Study with Japanese videos while drinking some tea.
          </span>
          <canvas class="teacup-art teacup-sprite" width="32" height="32"></canvas>
        </button>
        <button class="object-button teapot-button" type="button" aria-label="Teekanne">
          <span class="teapot-stage" aria-hidden="true">
            <canvas class="teapot-sprite" width="44" height="45"></canvas>
          </span>
        </button>
        <a class="study-link" href="/japanese/" aria-label="Japanisch lernen">JP</a>
      </div>

      <div class="item-row" aria-label="Auswahl">
        <a
          class="object-button item-button garden-button"
          href="/welcome-in-my-digital-garden!.html"
          aria-label="Digital Garden"
        >
          <span class="item-stage garden-stage" aria-hidden="true">
            <img class="item-art" src="/pixel/koi10.png" alt="" />
            <span class="garden-water"></span>
          </span>
        </a>

        <div class="zettel-card">
          <button
            class="object-button item-button zettel-button"
            type="button"
            aria-label="Zettelhaufen"
          >
            <span class="item-stage" aria-hidden="true">
              <canvas class="item-sprite zettel-sprite" width="84" height="81"></canvas>
            </span>
          </button>
          <a class="study-link" href="/zettelkasten/" aria-label="Zettelkasten öffnen">ZK</a>
        </div>
      </div>
    </main>

    <script src="/pixel/homepage.js" defer></script>
  </body>
</html>
